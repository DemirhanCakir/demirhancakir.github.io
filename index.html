<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demirhan Cakir</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background-color: #f8f9fa;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Navigation ── */
    nav {
      background-color: #ffffff;
      border-bottom: 1px solid #e0e0e0;
      padding: 1rem 2rem;
      display: flex;
      justify-content: center;
      gap: 2rem;
    }

    nav a {
      text-decoration: none;
      color: #555;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      transition: color 0.2s;
    }

    nav a:hover {
      color: #2563eb;
    }

    /* ── Main content ── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4rem 1.5rem;
    }

    .intro {
      max-width: 640px;
      text-align: center;
    }

    .intro h1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 1rem;
    }

    .intro p {
      font-size: 1.1rem;
      line-height: 1.75;
      color: #555;
      margin-bottom: 2rem;
    }

    .intro a.cta {
      display: inline-block;
      background-color: #2563eb;
      color: #fff;
      text-decoration: none;
      padding: 0.65rem 1.75rem;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    .intro a.cta:hover {
      background-color: #1d4ed8;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 1.25rem 1rem;
      font-size: 0.85rem;
      color: #888;
      border-top: 1px solid #e0e0e0;
      background-color: #ffffff;
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .intro h1 {
        font-size: 1.8rem;
      }

      .intro p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <nav>
    <a href="#home">Home</a>
    <a href="#projects">Projects</a>
    <a href="#contact">Contact</a>
  </nav>

  <main>
    <section class="intro" id="home">
      <h1>Hi, I'm Demirhan Cakir</h1>
      <p>
        Welcome to my personal portfolio. I'm a developer passionate about building
        clean, user-friendly applications. Explore my projects or get in touch!
      </p>
      <a class="cta" href="#projects">View Projects</a>
    </section>
  </main>

  <footer>
    &copy; 2026 Demirhan Cakir &mdash; Built with ❤️ and plain HTML
  </footer>

</body>
</html>
